<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4770"/>
      <stop offset="1" stop-color="#222842"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4b5f94"/>
      <stop offset="1" stop-color="#2b3557"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#33ccff"/>
      <stop offset="1" stop-color="#00ff99"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Desk -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>

  <!-- Monitor -->
  <g filter="url(#shadow)">
    <rect x="56" y="82" width="16" height="10" fill="#15171e"/>
    <rect x="44" y="90" width="40" height="6" rx="3" fill="#15171e"/>
    <rect x="18" y="28" width="92" height="58" rx="8" fill="#15171e"/>
  </g>
  <rect x="23" y="33" width="82" height="48" rx="4" fill="url(#screen)"/>

  <!-- Tiled windows, the left one active -->
  <rect x="27.5" y="37.5" width="37" height="39" rx="4" fill="#ffffff" fill-opacity="0.13"
        stroke="url(#active)" stroke-width="2.6"/>
  <rect x="68" y="37" width="33" height="18.5" rx="4" fill="#ffffff" fill-opacity="0.13"/>
  <rect x="68" y="58.5" width="33" height="18.5" rx="4" fill="#ffffff" fill-opacity="0.07"
        stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- Placed app stickers -->
  <rect x="32" y="43" width="24" height="8" rx="4" fill="#ffd166"/>
  <rect x="32" y="54" width="17" height="8" rx="4" fill="#b8f2a0"/>
  <rect x="72" y="42" width="20" height="8" rx="4" fill="#7bdff2"/>

  <!-- Sticker being dragged onto a workspace -->
  <g transform="rotate(-12 94 76)" filter="url(#shadow)">
    <rect x="74" y="68.5" width="40" height="15" rx="7.5" fill="#ff8fab"/>
    <circle cx="82" cy="76" r="2.6" fill="#1a1c24" fill-opacity="0.55"/>
    <rect x="88" y="74" width="19" height="4" rx="2" fill="#1a1c24" fill-opacity="0.35"/>
  </g>
</svg>
